# Manual corrections layered onto the auto-fetched ORCID/CrossRef data.
# Re-applied by cite.py on every run, so these survive the next scheduled
# refresh instead of being wiped out. DOIs are matched case-insensitively
# and without the https://doi.org/ prefix.

# Force a specific type when ORCID's own classification is wrong
# (e.g. a conference abstract that ORCID tagged as "preprint").
# Recognized types in publications.qmd: journal-article, preprint,
# conference-paper (falls back to "Other" if unrecognized).
type_overrides:
  10.5194/oos2025-740: conference-paper

# Preprints that have since been published in peer-reviewed form.
# key: preprint DOI, value: DOI of the published version.
# The preprint entry is removed from the list; the published entry gets a
# "Preprint" button linking back to it instead.
superseded_by:
  10.32942/x29w4w: 10.1111/1365-2656.14120           # -> Villeneuve & White 2025, J Animal Ecology
  10.21203/rs.3.rs-987225/v1: 10.1038/s41558-022-01534-y  # -> Sasaki et al. 2022, Nature Climate Change

# DOIs to drop entirely (duplicates, withdrawn works, etc.)
exclude: []

# Manual link for entries with no DOI/URL at all (old ORCID records that
# predate DOIs, etc.). Matched by exact title text as it appears in
# _data/publications.json. Shows as a "Link" button in place of "DOI".
url_overrides:
  "Habitat selection and population density of the world’s smallest chameleon, brookesia micra, on Nosy Hara, Madagascar": "https://www.herpconbio.org/Volume_12/Issue_2/Villeneuve_2017.pdf"

# Metadata CrossRef has no way to supply, usually because the entry has no
# DOI to look up (old ORCID records that predate DOIs). Matched by exact
# ORCID title text. Only fields the record is still missing get filled in --
# this never overwrites an auto-fetched value. Also used to attach a
# correctly formatted (e.g. italicized) title, since ORCID only ever gives
# us plain text and there's no CrossRef record to pull markup from instead.
#
# Also handy for journal cover art: set "volume" here if CrossRef didn't
# supply one, or set "cover" directly to force a specific image filename
# stem (e.g. "journal-of-animal-ecology-2020b") when the auto-computed
# <slug>-<year>-<volume>/<slug>-<year>/<slug> lookup can't tell two
# same-year entries in the same journal apart. See
# images/journal-covers/README.md.
manual_fields:
  "Habitat selection and population density of the world’s smallest chameleon, brookesia micra, on Nosy Hara, Madagascar":
    journal: "Herpetological Conservation and Biology"
    authors: ["Andrew R. Villeneuve"]
    title: "Habitat selection and population density of the world’s smallest chameleon, <i>Brookesia micra</i>, on Nosy Hara, Madagascar"

  # Two 2021 RSPB B papers with no CrossRef volume to tell them apart by --
  # pin each to its own cover image explicitly.
  "Limited plasticity in thermally tolerant ectotherm populations: evidence for a trade-off":
    cover: "proceedings-of-the-royal-society-b-biological-sciences-2021a"
  "Environment and phenology shape local adaptation in thermal performance":
    cover: "proceedings-of-the-royal-society-b-biological-sciences-2021b"

  # Conference papers have no "journal" to key art off of, and this one's
  # logo (Ocean Sciences Meeting) is specific to this conference rather than
  # conference papers generally -- everything else of type "conference-paper"
  # falls back to the generic images/journal-covers/conference-paper.jpg.
  "Forecasting the impacts of Marine Heatwaves on habitat-forming invertebrate species":
    cover: "oos"
