project:
  type: website
  output-dir: docs
  resources:
    - _data/publications.json
    # Journal cover thumbnails are loaded dynamically via JS (img.src set in
    # code, not a static <img src>), so Quarto's static-asset scanner never
    # sees them as "used" and won't copy them into docs/ on its own.
    - images/journal-covers/

website:
  open-graph: true
  title: "Dr. Andrew R. Villeneuve"
  site-url: https://villesci.github.io
  twitter-card: true
  favicon: 'images/bahamafull.jpg'
  google-analytics: 
    tracking-id: "G-S82TX4CM9T"
    anonymize-ip: true
  navbar: 
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: posts.qmd
        text: Blog
    right:
      - icon: github
        href: "https://github.com/villesci"
      - text: "{{< iconify fa6-brands:bluesky >}} Bluesky"
        href: "https://bsky.app/profile/villesci.bsky.social"

format:
  html:
    theme: 
    - sandstone
    css: styles.css
    toc: false
    

editor: visual


